<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Knocker — Launch Video</title>
<style>
  html, body { margin: 0; padding: 0; height: 100%; overflow: hidden; background: #FAFAF7; }
  #root { position: fixed; inset: 0; }
  * { box-sizing: border-box; }
</style>
</head>
<body data-screen-label="00:00 Knocker Launch">
<div id="root"></div>

<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

<script type="text/babel" src="video/animations.jsx"></script>
<script type="text/babel" src="video/components.jsx"></script>
<script type="text/babel" src="video/scenes.jsx"></script>
<script type="text/babel" src="video/tweaks-panel.jsx"></script>

<script type="text/babel">
const TWEAK_DEFAULTS = /*EDITMODE-BEGIN*/{
  "cursorX": 646,
  "cursorY": 621,
  "showCursorGuide": false,
  "loopVideo": true,
  "background": "#ffffff"
}/*EDITMODE-END*/;

function TweaksHost() {
  const [t, setTweak] = useTweaks(TWEAK_DEFAULTS);
  React.useEffect(() => {
    window.__tweakCursorX = t.cursorX;
    window.__tweakCursorY = t.cursorY;
    window.__tweakShowCursorGuide = t.showCursorGuide;
  }, [t.cursorX, t.cursorY, t.showCursorGuide]);
  return (
    <TweaksPanel title="Knocker Launch · Tweaks">
      <TweakSection label="Tap target — Interested button" />
      <TweakSlider label="Cursor X" value={t.cursorX} min={400} max={900} step={1} unit="px"
                   onChange={(v) => setTweak('cursorX', v)} />
      <TweakSlider label="Cursor Y" value={t.cursorY} min={400} max={800} step={1} unit="px"
                   onChange={(v) => setTweak('cursorY', v)} />
      <TweakToggle label="Show target guide" value={t.showCursorGuide}
                   onChange={(v) => setTweak('showCursorGuide', v)} />
      <TweakSection label="Stage" />
      <TweakColor  label="Background" value={t.background}
                   options={['#ffffff', '#0a0a0a', '#f5f5f7', '#0F1011']}
                   onChange={(v) => setTweak('background', v)} />
      <TweakToggle label="Loop video" value={t.loopVideo}
                   onChange={(v) => setTweak('loopVideo', v)} />
    </TweaksPanel>
  );
}

function TimecodeLabel() {
  const t = useTime();
  React.useEffect(() => {
    const root = document.body;
    const m = Math.floor(t / 60);
    const s = Math.floor(t % 60);
    const label = `${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')} Knocker Launch`;
    if (root.dataset.screenLabel !== label) {
      root.dataset.screenLabel = label;
    }
  }, [Math.floor(t)]);
  return null;
}

function App() {
  const [t] = useTweaks(TWEAK_DEFAULTS);
  return (
    <Stage width={1080} height={1080} duration={23} background={t.background} persistKey="knocker-launch" loop={t.loopVideo}>
      <TimecodeLabel/>
      <TweaksHost/>

      {/* Scene 1: Cold open — pin drop + wordmark */}
      <Sprite start={0} end={4}>
        <SceneOpen/>
      </Sprite>

      {/* Scene 2: 3D phone reveals map (was Scene 3, shifted -7s after SceneMap removed) */}
      <Sprite start={4} end={10.5}>
        <ScenePhoneMap/>
      </Sprite>

      {/* Scene 3: Log Door sheet, tap Interested */}
      <Sprite start={10.5} end={17}>
        <SceneLogDoor/>
      </Sprite>

      {/* Scene 4: Pipeline list */}
      <Sprite start={17} end={20.5}>
        <ScenePipeline/>
      </Sprite>

      {/* Scene 5: Logo lockup */}
      <Sprite start={20.5} end={23}>
        <SceneLogo/>
      </Sprite>
    </Stage>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
